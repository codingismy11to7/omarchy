name: Release Installer ISO

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-iso:
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            arch: x86_64
          - system: aarch64-linux
            arch: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        if: matrix.system == 'aarch64-linux'
        uses: docker/setup-qemu-action@v3

      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-platforms = aarch64-linux

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build ISO
        run: nix build .#nixosConfigurations.installer-${{ matrix.system }}.config.system.build.isoImage

      - name: Rename ISO
        run: |
          iso=$(find result/iso -name '*.iso' -print -quit)
          cp "$iso" "omarchy-installer-${{ matrix.arch }}.iso"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.arch }}
          path: omarchy-installer-${{ matrix.arch }}.iso

  release:
    needs: build-iso
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: omarchy-installer-*.iso
